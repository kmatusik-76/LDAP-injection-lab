<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Laboratorium LDAP injection{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bar {{ 'safe' if secure_mode else 'vuln' }}">
    <span class="mode">
      Tryb: <strong>{{ 'BEZPIECZNY' if secure_mode else 'PODATNY' }}</strong>
      {{ '(escapowanie + bind + autoryzacja)' if secure_mode else '(konkatenacja danych wejściowych)' }}
    </span>
    <form method="post" action="{{ url_for('main.toggle') }}">
      <input type="hidden" name="next" value="{{ request.full_path }}">
      <button type="submit">Przełącz na {{ 'PODATNY' if secure_mode else 'BEZPIECZNY' }}</button>
    </form>
  </div>

  <nav>
    <a href="{{ url_for('main.index') }}">Start</a>
    <a href="{{ url_for('main.directory') }}">Katalog LDAP</a>
    {% for s in scenarios %}
      <a href="{{ url_for(s.endpoint) }}">{{ s.nav_label }}</a>
    {% endfor %}
    <a href="{{ url_for('main.flags') }}">Sprawdź flagę</a>
  </nav>

  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
