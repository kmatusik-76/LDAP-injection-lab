<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lab LDAP injection{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bar {{ 'safe' if secure_mode else 'vuln' }}">
    <span class="mode-tag"><span class="dot"></span>
      Tryb: {{ 'BEZPIECZNY — escape + bind + autoryzacja' if secure_mode
               else 'PODATNY — konkatenacja stringow' }}</span>
    <form method="post" action="{{ url_for('main.toggle') }}">
      <button type="submit">Przelacz na {{ 'PODATNY' if secure_mode else 'BEZPIECZNY' }}</button>
    </form>
    <span class="spacer"></span>
    {% if current_user %}
      <span class="who">Zalogowany: {{ current_user.uid or current_user.dn }}</span>
      <form method="post" action="{{ url_for('main.logout') }}"><button type="submit">Wyloguj</button></form>
    {% endif %}
  </div>
  <nav>
    <a href="{{ url_for('main.login') }}">Logowanie</a>
    <a href="{{ url_for('main.search') }}">Wyszukiwarka pracownikow</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
