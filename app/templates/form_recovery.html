<form method="post" action="{{ url_for('main.recovery') }}">
  <label for="uid">Login konta (uid)</label>
  <input type="text" id="uid" name="uid" autocomplete="off" value="{{ uid }}">
  <label for="pin">PIN do odzyskiwania (4 cyfry)</label>
  <input type="text" id="pin" name="pin" autofocus autocomplete="off" value="{{ pin }}">
  <button class="btn" type="submit">Sprawdz</button>
</form>
