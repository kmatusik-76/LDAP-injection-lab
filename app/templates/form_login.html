<form method="post" action="{{ url_for('main.login') }}">
  <label for="username">Login (uid)</label>
  <input type="text" id="username" name="username" autofocus autocomplete="off"
         value="{{ request.form.username or '' }}">
  <label for="password">Haslo</label>
  <input type="text" id="password" name="password" autocomplete="off"
         value="{{ request.form.password or '' }}">
  <button class="btn" type="submit">Zaloguj</button>
</form>
